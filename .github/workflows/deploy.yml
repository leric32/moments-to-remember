name: Deploy from Branch

on:
  push:
    branches: [main, staging, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      branch:
        description: 'Branch to deploy from'
        required: true
        default: 'main'

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      deploy-web: ${{ steps.set-env.outputs.deploy-web }}
      deploy-android: ${{ steps.set-env.outputs.deploy-android }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi
          
          # Enable web deployment for all environments
          echo "deploy-web=true" >> $GITHUB_OUTPUT
          
          # Enable Android deployment only for staging and production
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == "refs/heads/staging" ]] || [[ "${{ github.event.inputs.environment }}" == "staging" ]] || [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "deploy-android=true" >> $GITHUB_OUTPUT
          else
            echo "deploy-android=false" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --dart-define=ENVIRONMENT=${{ needs.determine-environment.outputs.environment }}

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ needs.determine-environment.outputs.environment }}
          path: build/web/

    needs: determine-environment

  deploy-web:
    runs-on: ubuntu-latest
    needs: [determine-environment, build-and-test]
    if: needs.determine-environment.outputs.deploy-web == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build-${{ needs.determine-environment.outputs.environment }}
          path: build/web/

      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }} --project ${{ needs.determine-environment.outputs.environment }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy to GitHub Pages (fallback)
        if: env.FIREBASE_TOKEN == '' && needs.determine-environment.outputs.environment == 'production'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web

  build-android:
    runs-on: ubuntu-latest
    needs: [determine-environment, build-and-test]
    if: needs.determine-environment.outputs.deploy-android == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=ENVIRONMENT=${{ needs.determine-environment.outputs.environment }}

      - name: Build AAB (for production)
        if: needs.determine-environment.outputs.environment == 'production'
        run: flutter build appbundle --release --dart-define=ENVIRONMENT=${{ needs.determine-environment.outputs.environment }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.determine-environment.outputs.environment }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact (production only)
        if: needs.determine-environment.outputs.environment == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-production
          path: build/app/outputs/bundle/release/app-release.aab

  build-desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    needs: [determine-environment, build-and-test]
    if: needs.determine-environment.outputs.environment == 'production'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Enable desktop platform
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Build desktop app
        run: flutter build ${{ matrix.platform }} --release --dart-define=ENVIRONMENT=${{ needs.determine-environment.outputs.environment }}

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ needs.determine-environment.outputs.environment }}
          path: build/${{ matrix.platform }}/

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-web, build-android, build-desktop]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.event.inputs.branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Web Deployment:** ${{ needs.deploy-web.result || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Android Build:** ${{ needs.build-android.result || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Desktop Build:** ${{ needs.build-desktop.result || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY